<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argument Steelmanner</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #eef0f4;
    --muted: #9aa1ac;
    --accent: #6d8dff;
    --accent-dim: #445a99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main {
    width: 100%;
    max-width: 680px;
  }
  h1 {
    font-size: 1.7rem;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 1rem;
    color: var(--text);
    font-family: inherit;
    line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--accent); }
  button {
    margin-top: 14px;
    background: var(--accent);
    color: #0b0d11;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: var(--accent-dim);
    cursor: not-allowed;
  }
  #result-wrap {
    margin-top: 28px;
    display: none;
  }
  #result-wrap.visible { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  .card-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #status {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <h1>🛡️ Argument Steelmanner</h1>
  <p class="subtitle">
    Paste an opinion or argument below. An AI model running entirely on your own machine —
    no cloud, no API key — will write the strongest possible counter-argument against it.
  </p>

  <textarea id="opinion" placeholder="e.g. Remote work is better than working in an office."></textarea>
  <br />
  <button id="submit-btn">Steelman it</button>

  <div id="status"></div>

  <div id="result-wrap">
    <div class="card-label">Strongest counter-argument</div>
    <div class="card" id="result"></div>
  </div>

  <footer>Powered by QVAC — on-device AI, no data ever leaves this machine.</footer>
</main>

<script>
  const btn = document.getElementById("submit-btn");
  const textarea = document.getElementById("opinion");
  const status = document.getElementById("status");
  const resultWrap = document.getElementById("result-wrap");
  const resultEl = document.getElementById("result");

  btn.addEventListener("click", async () => {
    const opinion = textarea.value.trim();
    if (!opinion) {
      status.textContent = "Please type an opinion or argument first.";
      return;
    }

    btn.disabled = true;
    resultWrap.classList.remove("visible");
    status.textContent = "Thinking… (the first request can take a minute while the model loads)";

    try {
      const res = await fetch("/api/steelman", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ opinion }),
      });
      const data = await res.json();

      if (!res.ok) {
        status.textContent = data.error || "Something went wrong.";
        return;
      }

      status.textContent = "";
      resultEl.textContent = data.steelman;
      resultWrap.classList.add("visible");
    } catch (err) {
      status.textContent = "Could not reach the server. Is it still running?";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
